app = 'rust-blog-api'
primary_region = 'nrt'  # 東京

[build]

[env]
  DATABASE_URL = 'sqlite:/data/blog.db'
  UPLOAD_DIR   = '/data/uploads'
  RUST_LOG     = 'rust_blog_api=info,tower_http=info'

# SQLite ファイルの永続化
[[mounts]]
  source = 'blog_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
